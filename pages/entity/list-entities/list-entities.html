    <!-- Dialog -->
    <dialog class="dialog-edit">
        <h2>Atualizar Entidade</h2>
        <button class="form-edit__close-modal">
            <img src="/assets/img/img-list-entities/img_close_modal.png" alt="">
        </button>
        
        <form class="form-edit">

            <div class="form-edit__closest form-edit__name form-edit__style-field">
                <label for="entityName">Nome*</label>
                <input id="entityName" name="entityName" type="text" placeholder="Ex: Criatura Noturna" required />
                <span class="form-edit__span-field">Campo obrigatório</span>
            </div>

            <div class="form-edit__closest form-edit__counter-measure form-edit__style-field">
                <label for="counterMeasure">Contramedida*</label>
                <input id="counterMeasure" name="counterMeasure" type="text" placeholder="Ex: Barreira Salina..."
                    required />
                <span class="form-edit__span-field">Campo obrigatório</span>
            </div>

            <div class="form-edit__closest form-edit__risk-level form-edit__style-field">
                <label for="riskLevel">Nível Risco*</label>
                <select id="riskLevel" name="riskLevel" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <span class="form-edit__span-field">Campo obrigatório</span>
            </div>

            <div class="form-edit__closest form-edit__entity-image form-edit__style-field">
                <div class="form-edit__container-file">
                    <label class="form-edit__file" for="entityImage">Trocar Imagem</label>
                    <input id="entityImage" name="entityImage" type="file" />
                    <span class="form-edit__file-name">Vazio</span>
                </div>

                <div class="form-edit__span-field form-edit__span-file">
                    <span>Extensões permitidas:</span>

                    <ul>
                        <li>png</li>
                        <li>jpg</li>
                        <li>jpeg</li>
                    </ul>
                </div>
            </div>

            <div class="form-edit__closest form-edit__common-signs form-edit__style-field">
                <label for="commonSigns">Sinais Comuns*</label>
                <textarea id="commonSigns" name="commonSigns" rows="4"
                    placeholder="Ex: Ruídos, falhas elétricas, temperatura baixa..." required></textarea>
                <span class="form-edit__span-field">Campo obrigatório</span>
            </div>

            <button class="form-edit__button-submit" type="submit">Atualizar</button>
        </form>
    </dialog>
