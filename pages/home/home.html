<body>
    <a class="skip-link" href="#content">Pular Menu de Navegação</a>

    <app-navbar></app-navbar>

    <!-- Main content -->
    <main id="content" class="main-content" tabindex="-1">
        <h1>Painel do Bunker</h1>

        <!-- Section cards -->
        <section class="section-cards" aria-label="Resumo de casos">
            <article class="section-cards__style-card">
                <h3>Casos Abertos</h3>
                <p class="section-cards__open-cases">0</p>
                <img class="section-cards__img" src="/assets/img/img-home/img_open_cases.png"
                    alt="Ícone de prancheta com lupa, representando casos abertos" />
            </article>

            <article class="section-cards__style-card">
                <h3>Casos Investigando</h3>
                <p class="section-cards__cases-under-investigation">0</p>
                <img class="section-cards__img" src="/assets/img/img-home/img_cases_under_investigation.png"
                    alt="Ícone de mural de investigação com lupa, representando casos em investigação" />
            </article>

            <article class="section-cards__style-card">
                <h3>Casos Resolvidos</h3>
                <p class="section-cards__solved-cases">0</p>
                <img class="section-cards__img" src="/assets/img/img-home/img_solved_cases.png"
                    alt="Ícone de prancheta com check, representando casos resolvidos" />
            </article>

            <article class="section-cards__style-card">
                <h3>Casos Arquivados</h3>
                <p class="section-cards__archived-cases">0</p>
                <img class="section-cards__img" src="/assets/img/img-home/img_archived_cases.png"
                    alt="Ícone de caixa de arquivo, representando casos arquivados" />
            </article>
        </section>

        <!-- Section table -->
        <section class="section-table" aria-label="Últimas ocorrências">
            <h3>Últimas Caçadas</h3>

            <table class="section-table__table">
                <thead class="section-table__thead">
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col" class="section-table__hide-in-mobile">Tipo</th>
                        <th scope="col">Dificuldade</th>
                        <th scope="col" class="section-table__hide-in-mobile">Cidade</th>
                        <th scope="col" class="section-table__hide-in-mobile">Data</th>
                        <th scope="col" class="section-table__hide-in-mobile">Descrição</th>
                        <th scope="col" class="section-table__hide-in-desktop">Detalhes</th>
                    </tr>
                </thead>
